name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: fake
      DATABASE_URL: /tmp/moon-council-ci.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint:python
      - run: python3 scripts/test_public_snapshot.py
      - run: python3 scripts/test_checkpoint.py
      - run: python3 scripts/public-snapshot.py --source . --verify-history
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
